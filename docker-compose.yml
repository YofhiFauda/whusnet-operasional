services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whusnet-app
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "
        echo '⏳ Initializing App...';
        if [ ! -f vendor/autoload.php ]; then
          echo '📦 Vendor not found, installing...';
          composer install --no-interaction --optimize-autoloader;
        fi &&
        echo '🚀 Starting PHP-FPM...';
        php-fpm
      "
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Whusnet
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: landing_page
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: whusnet-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: whusnet-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: landing_page
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: admin
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: whusnet-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  ngrok:
    image: ngrok/ngrok:alpine
    container_name: whusnet-ngrok
    restart: unless-stopped
    command: ["http", "nginx:80"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  dbdata:
  storage_data:
  cache_data: