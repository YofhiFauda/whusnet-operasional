services:
  # ── Build aset frontend (Vite: CSS Tailwind + JS termasuk Alpine) ──
  #
  # KENAPA ADA DI SINI, padahal Dockerfile sudah punya tahap `assets`:
  # service app & nginx bind-mount `./:/var/www`, dan bind-mount MENUTUPI isi
  # image di path yang sama. Artinya `public/build` yang benar-benar dilayani
  # nginx (`root /var/www/public`) SELALU milik host, bukan hasil build image.
  # Tahap di Dockerfile cuma menolong deploy berbasis image murni (tanpa mount).
  #
  # Sejak Alpine dicabut dari CDN (ADHOC-20), tidak adanya `public/build` bukan
  # lagi sekadar "tampilan berantakan": Laravel melempar ViteException dan
  # seluruh interaksi Alpine mati. Jadi build dijadikan SYARAT START, bukan
  # langkah manual yang bisa terlupakan — app & nginx menunggu service ini
  # keluar dengan sukses (`service_completed_successfully`).
  #
  # `npm install` (bukan `npm ci`) disengaja: ini jalan tiap `up`, dan install
  # yang sudah sinkron selesai dalam hitungan detik, sementara `npm ci` selalu
  # menghapus lalu memasang ulang node_modules di direktori host.
  #
  # Jalan sebagai root LALU `chown` hasilnya ke pemilik repo di host. Bukan
  # `user:` sejak awal, karena build yang lama meninggalkan `public/build`
  # milik root: user non-root tak bisa menghapusnya (direktorinya root, mode
  # 755) dan Vite gagal EACCES saat mengosongkan outDir. Pola root+chown ini
  # memperbaiki keadaan yang sudah terlanjur TANPA perlu sudo di host, dan
  # mencegahnya terulang. Override HOST_UID/HOST_GID lewat .env kalau UID host
  # bukan 1000 (`id -u; id -g`).
  #
  # `storage/framework/testing` ikut di-chown karena kena jebakan yang sama:
  # `php artisan test` dari host memakai direktori itu sebagai disk sementara,
  # dan begitu ada proses root (docker) yang menulis duluan, seluruh test yang
  # menyentuh unggahan berkas gagal `Permission denied` — kegagalan yang sama
  # sekali tidak ada hubungannya dengan kode yang sedang diuji. Bind mount di
  # service ini adalah direktori HOST (service app memakai named volume untuk
  # storage), jadi yang diperbaiki memang berkas yang dipakai test.
  assets:
    image: node:22-alpine
    container_name: whusnet-assets
    working_dir: /var/www
    restart: "no"
    command: >
      sh -c "
        echo '📦 Membangun aset frontend (Vite)...';
        npm install --no-audit --no-fund &&
        npm run build &&
        chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} public/build node_modules &&
        if [ -d storage/framework/testing ]; then
          chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} storage/framework/testing;
          echo '🧹 storage/framework/testing dikembalikan ke pemilik host.';
        fi &&
        echo '✅ Aset siap di public/build.'
      "
    volumes:
      - ./:/var/www
    networks:
      - app_network

  app:
    image: whusnet-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whusnet-app
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "
        echo '⏳ Initializing App...';
        if [ ! -f vendor/autoload.php ]; then
          echo '📦 Vendor not found, installing...';
          composer install --no-interaction --optimize-autoloader;
        fi &&
        echo '🚀 Starting PHP-FPM...';
        php-fpm
      "
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      # Tanpa manifest Vite, halaman apa pun yang meng-@vite langsung 500
      # (ViteException) — jadi PHP-FPM tidak boleh melayani sebelum aset jadi.
      assets:
        condition: service_completed_successfully
    environment:
      APP_NAME: Whusnet-Operasional
      # DB_* SENGAJA tak diulang di sini (2026-08-03). Compose `environment:`
      # jadi env var level-OS container — lapisan ini menang atas .env DAN
      # atas .env.testing/phpunit.xml `force="true"` saat `php artisan test`
      # dijalankan lewat `docker exec`, karena sudah ada di process env
      # SEBELUM PHP/Dotenv jalan. Akibatnya semua test RefreshDatabase
      # nyasar ke MySQL asli, bukan sqlite :memory: — ditemukan 2026-08-03.
      # .env sudah punya DB_CONNECTION=mysql/DB_HOST=db yang identik untuk
      # runtime normal, jadi menghapus baris ini di compose TIDAK mengubah
      # perilaku container saat jalan biasa — cuma membuka jalan supaya
      # .env.testing bisa menang saat testing.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # SESSION_DRIVER & CACHE_STORE SENGAJA tidak diulang di sini — pelajaran
      # yang sama dengan DB_* dan QUEUE_CONNECTION di atas.
      #
      # `CACHE_STORE: file` di lapisan ini mengisi $_SERVER, dan `env()` Laravel
      # membaca $_SERVER LEBIH DULU daripada putenv() — sehingga
      # `force="true"` pada phpunit.xml kalah. Akibatnya SELURUH test berbagi
      # cache file yang PERSISTEN lintas run: `user.1.permissions` yang
      # ter-cache sebagai `["*"]` di satu run membuat test RBAC di run
      # berikutnya melihat user biasa punya akses penuh. Itu penyebab 9 test
      # RBAC merah — bukan logika permission-nya.
      #
      # Nilainya ada di `.env` (file), jadi runtime tidak berubah.
      # QUEUE_CONNECTION SENGAJA tidak diulang di sini — sama alasannya dengan
      # DB_* di atas. Nilainya sudah `redis` di .env, jadi runtime tidak
      # berubah; yang berubah cuma siapa yang menang saat testing.
      #
      # Waktu baris `QUEUE_CONNECTION: redis` pernah ada di sini, ia jadi env
      # var level-OS dan mengisi $_SERVER. `env()` Laravel membaca $_SERVER
      # LEBIH DULU daripada putenv(), sementara `force="true"` di phpunit.xml
      # hanya menulis putenv() — jadi test yang seharusnya `sync` justru
      # mendorong job ke Redis ASLI. Horizon lalu menjalankan job berisi model
      # yang di-serialize dengan koneksi sqlite milik test: 576 job gagal
      # dengan SQLiteDatabaseDoesNotExistException, dan bertambah tiap kali
      # suite dijalankan.
      #
      # Harus LEBIH BESAR dari timeout job terpanjang (MatchPaymentReceipt =
      # 240 dtk, supervisor kwitansi = 300 dtk). Kalau lebih kecil, job yang
      # masih berjalan sudah dianggap mati dan diambil worker kedua — satu
      # berkas kwitansi dibaca dua kali.
      REDIS_QUEUE_RETRY_AFTER: 360
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: whusnet-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
      # nginx yang melayani /build/* langsung dari disk — kalau berkasnya belum
      # ada, aset 404 sementara halamannya sendiri sudah tampil (gaya & Alpine
      # hilang tanpa error yang jelas).
      assets:
        condition: service_completed_successfully
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: whusnet-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: whusnet_operasional
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: admin
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: whusnet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ─────────────────────────────────────────
  #  HORIZON — Queue Worker
  # ─────────────────────────────────────────
  horizon:
    image: whusnet-app:${APP_VERSION:-latest}
    container_name: whusnet-horizon
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - app_network
    env_file:
      - .env
    volumes:
      - ./:/var/www
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    environment:
      CONTAINER_ROLE: horizon
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: whusnet_operasional
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Sejajar dengan service `app` — lihat catatan di sana.
      REDIS_QUEUE_RETRY_AFTER: 360
    command: php artisan horizon
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'horizon' >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────
  #  REVERB — WebSocket Server
  # ─────────────────────────────────────────
  reverb:
    image: whusnet-app:${APP_VERSION:-latest}
    container_name: whusnet-reverb
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - app_network
    ports:
      - "8081:8081"
    volumes:
      - ./:/var/www
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    environment:
      CONTAINER_ROLE: reverb
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: whusnet_operasional
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan reverb:start --host="0.0.0.0" --port=8081
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # nc (netcat) lebih tepat untuk WebSocket — cukup cek port TCP terbuka
      # curl bisa return non-200 pada WebSocket server meski sebenarnya healthy
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────
  #  SCHEDULER — Laravel Cron
  # ─────────────────────────────────────────
  scheduler:
    image: whusnet-app:${APP_VERSION:-latest}
    container_name: whusnet-scheduler
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - app_network
    env_file:
      - .env
    volumes:
      - ./:/var/www
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    environment:
      CONTAINER_ROLE: scheduler
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: whusnet_operasional
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Sejajar dengan service `app` — lihat catatan di sana.
      REDIS_QUEUE_RETRY_AFTER: 360
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 96M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      # schedule:work adalah long-running process — pgrep lebih tepat dari 'ps aux | grep php'
      # 'ps aux | grep php' hampir selalu true karena grep itu sendiri muncul sebagai proses
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: whusnet-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # ─────────────────────────────────────────
  #  CLOUDFLARE TUNNEL — HTTPS tanpa buka port
  # ─────────────────────────────────────────
  #
  # OPSIONAL: tidak ikut `docker compose up` biasa karena pakai `profiles`.
  #   docker compose --profile tunnel up -d cloudflared
  #
  # Menembak ke `nginx:80` lewat jaringan internal, jadi port 8000 di host
  # tidak perlu diekspos ke internet sama sekali. TLS diputus di sisi
  # Cloudflare; nginx tetap menerima HTTP polos dan menandai request aslinya
  # https lewat X-Forwarded-Proto (lihat docker/nginx/default.conf).
  #
  # Dua mode:
  #   1. Quick tunnel (default) — URL acak *.trycloudflare.com, ganti tiap
  #      restart. Cek URL-nya: `docker compose logs -f cloudflared`.
  #      URL berubah = APP_URL di .env ikut diganti, lalu `php artisan
  #      config:clear`. Aset & Reverb TIDAK perlu di-build ulang: echo.js
  #      memakai host halaman yang sedang dibuka.
  #   2. Tunnel bernama (domain tetap) — di .env isi:
  #        CLOUDFLARED_COMMAND=tunnel --no-autoupdate run --token <TOKEN>
  #      Token dari dashboard Cloudflare Zero Trust; public hostname-nya
  #      diarahkan ke `http://nginx:80`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: whusnet-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ${CLOUDFLARED_COMMAND:-tunnel --no-autoupdate --url http://nginx:80}
    depends_on:
      nginx:
        condition: service_started
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  app_network:
    driver: bridge

volumes:
  dbdata:
  storage_data:
  cache_data:
  redis_data: