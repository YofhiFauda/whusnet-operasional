# ── Normalisasi header proxy ──────────────────────────────────────────────
#
# Rantai request di produksi: browser → Cloudflare (TLS diputus di sini) →
# cloudflared → nginx (HTTP polos, port 80) → PHP-FPM. nginx TIDAK PERNAH
# melihat TLS, jadi $scheme selalu "http". Satu-satunya bukti request aslinya
# https adalah header X-Forwarded-Proto dari Cloudflare.
#
# `map` dipakai supaya ada nilai default: kalau header tidak ada (akses
# langsung http://ip:8000 saat dev), jangan teruskan header KOSONG ke PHP —
# Symfony menganggap header yang ada tapi kosong sebagai skema kosong dan
# url()/route() jadi rusak. Default ke $scheme = perilaku non-proxy yang benar.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# fastcgi_param HTTPS hanya boleh dikirim saat memang https. Mengirim
# "HTTPS=off" pun sudah membuat sebagian kode PHP menganggapnya menyala,
# jadi nilai untuk http sengaja string kosong (parameter kosong = dianggap
# tak ada oleh PHP).
map $forwarded_proto $fastcgi_https {
    default "";
    https   "on";
}

map $forwarded_proto $forwarded_port {
    default 80;
    https   443;
}

# Nilai default header Upgrade untuk proxy WebSocket (Reverb). Tanpa map ini,
# koneksi non-WebSocket ikut dikirimi `Connection: Upgrade` dan nyangkut.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/public;

    # Allow large uploads
    client_max_body_size 64M;

    # Serve storage files directly as static assets (no PHP involved).
    #
    # WAJIB pakai '^~': tanpa itu, blok regex ekstensi gambar di bawah menang
    # (nginx mengevaluasi regex location SEBELUM prefix location biasa), sehingga
    # semua foto .jpg/.png di bawah /storage/ tidak pernah kena alias ini —
    # dicari di /var/www/public/storage/ yang tidak ada, lalu 404. Gejalanya:
    # file .txt di /storage/ bisa dibuka, tapi semua preview foto kosong.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }

    # Serve static build assets with CORS allow header
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|json|map)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # WebSocket Reverb. Lewat tunnel, browser membuka wss://<host>/app/... —
    # Cloudflare menurunkannya jadi ws:// polos ke sini, jadi blok ini tetap
    # bicara ws biasa ke container reverb. Header X-Forwarded-* diteruskan
    # supaya Reverb tahu origin aslinya.
    location /app/ {
        resolver 127.0.0.11 valid=30s;
        set $reverb_backend http://reverb:8081;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Koneksi WebSocket menganggur di antara event; default 60 detik
        # memutusnya dan dashboard realtime diam-diam berhenti update.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # ── Header proxy (localhost, Cloudflare Tunnel, reverse proxy lain) ──
        # Laravel mempercayainya lewat trustProxies() di bootstrap/app.php.
        fastcgi_param HTTPS                  $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $forwarded_port;

        # Teruskan IP asli pengguna (dari Cloudflare) ke Laravel
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # Unggahan besar (dokumen & foto evidence) lewat tunnel bisa lambat.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.ht {
        deny all;
    }
}
