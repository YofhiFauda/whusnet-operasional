server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;

    # Allow large uploads
    client_max_body_size 64M;

    # Serve storage files directly as static assets (no PHP involved).
    #
    # WAJIB pakai '^~': tanpa itu, blok regex ekstensi gambar di bawah menang
    # (nginx mengevaluasi regex location SEBELUM prefix location biasa), sehingga
    # semua foto .jpg/.png di bawah /storage/ tidak pernah kena alias ini —
    # dicari di /var/www/public/storage/ yang tidak ada, lalu 404. Gejalanya:
    # file .txt di /storage/ bisa dibuka, tapi semua preview foto kosong.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }

    # Serve static build assets with CORS allow header
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|json|map)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /app/ {
        resolver 127.0.0.11 valid=30s;
        set $reverb_backend http://reverb:8081;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # ── Proxy headers (Mendukung localhost & Cloudflare) ──────────
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;

        # Teruskan IP asli pengguna (dari Cloudflare) ke Laravel
        fastcgi_param HTTP_X_REAL_IP       $http_x_real_ip;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }


    #     location ~ \.php$ {
    #     fastcgi_pass app:9000;
    #     fastcgi_index index.php;
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    #     # ── Cloudflare Tunnel headers ──────────────────────────────────
    #     # Beritahu PHP bahwa request masuk via HTTPS (dari Cloudflare).
    #     fastcgi_param HTTPS                on;
    #     fastcgi_param X_FORWARDED_PROTO    https;
    #     fastcgi_param HTTP_X_FORWARDED_PROTO https;
    #     fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
    #     fastcgi_param HTTP_X_FORWARDED_PORT  443;

    #     # Teruskan IP asli pengguna (dari Cloudflare) ke Laravel
    #     fastcgi_param HTTP_X_REAL_IP       $http_x_real_ip;
    #     fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    # }

    location ~ /\.ht {
        deny all;
    }
}