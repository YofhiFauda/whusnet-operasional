# ── nginx produksi — image self-contained (bukan bind-mount seperti dev) ──
#
# BEDA dari docker/nginx/default.conf (dev):
# - root & static assets dibakar ke image ini sendiri (stage `web` di
#   Dockerfile.prod), bukan dibaca dari `./:/var/www` bind-mount.
# - Coolify sendiri yang duduk di depan (TLS diputus Coolify/Traefik), jadi
#   pola X-Forwarded-Proto-nya sama seperti di belakang Cloudflare Tunnel:
#   nginx TIDAK PERNAH melihat TLS langsung, $scheme selalu http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# fastcgi_param HTTPS hanya boleh dikirim saat memang https — mengirim
# "HTTPS=off" pun sudah dianggap menyala oleh sebagian kode PHP.
map $forwarded_proto $fastcgi_https {
    default "";
    https   "on";
}

map $forwarded_proto $forwarded_port {
    default 80;
    https   443;
}

# Default header Upgrade untuk proxy WebSocket (Reverb) — tanpa ini request
# non-WebSocket ikut dikirimi Connection: Upgrade dan nyangkut.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── Rate limit per IP di tepi (sebelum PHP) ──────────────────────────────
#
# Lapis pertama pelindung worker php-fpm: request berlebih dari satu IP ditolak
# nginx (murah) sebelum menyentuh PHP/Laravel. Limiter aplikasi (per token,
# per akun, login) tetap jalan di belakangnya.
#
# KUNCI `$binary_remote_addr` hanya bermakna kalau nginx tahu IP klien ASLI.
# Di belakang proxy Coolify (Traefik), alamat TCP-nya selalu IP proxy; tanpa
# modul realip semua pengguna terhitung SATU IP dan seluruh situs ikut kena 429.
# `set_real_ip_from` hanya mempercayai jaringan privat/Docker (proxy kita), dan
# `real_ip_recursive on` mengambil alamat non-privat TERKANAN di
# X-Forwarded-For — yang ditambahkan proxy kita, bukan yang bisa diisi klien.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# API Portal Pelanggan DIKECUALIKAN (kunci kosong = tidak dihitung): semua
# pelanggan masuk lewat SATU server portal (BFF), jadi per-IP di sini akan
# menghitung 30.000 pelanggan sebagai satu klien. Portal dibatasi di Laravel
# (per token pelanggan, per IP pelanggan asli, dan batas total — ADHOC-224).
map $request_uri $limit_key {
    default                  $binary_remote_addr;
    ~^/api/customer-portal   "";
}

# 40 req/detik per IP, burst 80: satu kantor di balik satu IP publik (±50 staf
# membuka halaman + panggilan Alpine) masih lolos; klien yang membanjiri tidak.
limit_req_zone $limit_key zone=per_ip:10m rate=40r/s;
limit_req_status 429;

server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/public;

    client_max_body_size 64M;

    # Sembunyikan versi nginx (bocoran versi mempermudah pencocokan CVE).
    server_tokens off;

    # Header keamanan dasar untuk respons dinamis. Sengaja TANPA CSP/HSTS:
    # CSP perlu disetel terhadap inline script Alpine/Vite, dan HSTS dipasang
    # di proxy Coolify yang memegang TLS (nginx di sini selalu http).
    # Catatan: add_header di blok location menimpa yang di level server —
    # lokasi statis di bawah punya header cache sendiri dan itu disengaja.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Berkas upload (evidence, kwitansi) — dari volume `storage_data` yang
    # di-share dengan service `app`, bukan dibakar ke image ini.
    #
    # WAJIB '^~': tanpa itu blok regex ekstensi gambar di bawah menang
    # (nginx evaluasi regex location SEBELUM prefix biasa) dan semua foto
    # di /storage/ 404 karena dicari di public/storage yang tak ada di sini.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|json|map)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # WebSocket Reverb — resolver Docker DNS wajib (nama service `reverb`
    # di-resolve saat runtime, bukan saat nginx start, biar restart urutan
    # container tidak bikin nginx gagal start duluan).
    location /app/ {
        resolver 127.0.0.11 valid=30s;
        set $reverb_backend http://reverb:8081;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Koneksi WebSocket menganggur di antara event; default 60 detik
        # memutusnya dan dashboard realtime diam-diam berhenti update.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Hanya jalur PHP yang dibatasi — aset statis dan WebSocket tidak
        # memakan worker php-fpm. Lihat zona `per_ip` di atas.
        limit_req zone=per_ip burst=80 nodelay;

        resolver 127.0.0.11 valid=30s;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;

        # Header proxy — Laravel mempercayainya lewat trustProxies() di
        # bootstrap/app.php (TRUSTED_PROXIES=* di .env produksi).
        fastcgi_param HTTPS                  $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $forwarded_port;
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # Unggahan besar (dokumen & foto evidence) bisa lambat.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.ht {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
