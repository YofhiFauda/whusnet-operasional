# ── nginx produksi — image self-contained (bukan bind-mount seperti dev) ──
#
# BEDA dari docker/nginx/default.conf (dev):
# - root & static assets dibakar ke image ini sendiri (stage `web` di
#   Dockerfile.prod), bukan dibaca dari `./:/var/www` bind-mount.
# - Coolify sendiri yang duduk di depan (TLS diputus Coolify/Traefik), jadi
#   pola X-Forwarded-Proto-nya sama seperti di belakang Cloudflare Tunnel:
#   nginx TIDAK PERNAH melihat TLS langsung, $scheme selalu http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# fastcgi_param HTTPS hanya boleh dikirim saat memang https — mengirim
# "HTTPS=off" pun sudah dianggap menyala oleh sebagian kode PHP.
map $forwarded_proto $fastcgi_https {
    default "";
    https   "on";
}

map $forwarded_proto $forwarded_port {
    default 80;
    https   443;
}

# Default header Upgrade untuk proxy WebSocket (Reverb) — tanpa ini request
# non-WebSocket ikut dikirimi Connection: Upgrade dan nyangkut.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/public;

    client_max_body_size 64M;

    # Berkas upload (evidence, kwitansi) — dari volume `storage_data` yang
    # di-share dengan service `app`, bukan dibakar ke image ini.
    #
    # WAJIB '^~': tanpa itu blok regex ekstensi gambar di bawah menang
    # (nginx evaluasi regex location SEBELUM prefix biasa) dan semua foto
    # di /storage/ 404 karena dicari di public/storage yang tak ada di sini.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|json|map)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # WebSocket Reverb — resolver Docker DNS wajib (nama service `reverb`
    # di-resolve saat runtime, bukan saat nginx start, biar restart urutan
    # container tidak bikin nginx gagal start duluan).
    location /app/ {
        resolver 127.0.0.11 valid=30s;
        set $reverb_backend http://reverb:8081;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Koneksi WebSocket menganggur di antara event; default 60 detik
        # memutusnya dan dashboard realtime diam-diam berhenti update.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=30s;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;

        # Header proxy — Laravel mempercayainya lewat trustProxies() di
        # bootstrap/app.php (TRUSTED_PROXIES=* di .env produksi).
        fastcgi_param HTTPS                  $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $forwarded_port;
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # Unggahan besar (dokumen & foto evidence) bisa lambat.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.ht {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
