; ═══════════════════════════════════════════════════════════════════
;  PHP-FPM pool produksi — menimpa bawaan image (pm.max_children = 5)
; ═══════════════════════════════════════════════════════════════════
;
; Bawaan image resmi cuma 5 worker: 5 request PHP bersamaan lalu sisanya antre.
; Untuk ±30.000 pelanggan, lonjakan setelah notifikasi tagihan ≈ 40 req/detik
; × ±150 ms = ±6 worker sibuk terus-menerus, jadi 5 worker = antrean panjang
; dan staf ikut lambat. Angka di bawah dibaca dari ENV (default di
; Dockerfile.prod) supaya bisa disetel di Coolify tanpa membangun ulang image.
;
; Aturan hitung: FPM_MAX_CHILDREN ≈ (RAM yang disisihkan untuk PHP) / ±60 MB
; per worker. Contoh: 2 GB → ±30; 1 GB → ±15. JANGAN melebihi RAM — worker
; yang di-OOM-kill lebih buruk daripada antre. Pastikan juga `max_connections`
; MySQL ≥ FPM_MAX_CHILDREN + worker Horizon + cadangan.

[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}

; Daur ulang worker supaya kebocoran memori kecil tidak menumpuk.
pm.max_requests = 500

; Request yang menggantung (query macet, upload mandek) tidak boleh menahan
; worker selamanya. Harus >= fastcgi_read_timeout nginx (300s) dan
; max_execution_time (production.ini).
request_terminate_timeout = 310s

