upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Unggah kwitansi massal menerima 100 berkas sekali kirim
; (PaymentReceiptController::store, `files.*` max:100). Default PHP 20 memotong
; sisanya DIAM-DIAM: tidak ada error, tidak ada peringatan — berkas ke-21 dan
; seterusnya hilang begitu saja, dan admin mengira semuanya sudah terunggah.
; Angka di sini harus >= batas validasi di controller.
max_file_uploads = 100

; Batch pembayaran kolektor dikirim sebagai JSON, jadi batas ini tidak kena
; sekarang (200 baris × 4 field = 800 variabel). Dinaikkan sebagai jaring
; pengaman: kalau suatu saat form-nya berubah jadi form-encoded biasa,
; pemotongannya juga senyap dan batch kehilangan baris tanpa jejak.
max_input_vars = 5000
