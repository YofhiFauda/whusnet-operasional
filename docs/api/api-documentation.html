\n                      headers:\n                        - name: Content-Type\n                          value: application/json\n                      body:\n                        type: json\n                        data: |-\n                          {\n                            \"success\": false,\n                            \"message\": \"Batch ditolak \u2014 ada baris tidak valid. Tidak ada payment yang tersimpan.\",\n                            \"failures\": [\n                              {\n                                \"invoice_id\": 45,\n                                \"reason\": \"INV-2026-000123: Kelebihan hanya bisa dicatat lewat Tagihan admin.\"\n                              }\n                            ]\n                          }\n      - info:\n          name: Ping (health-check)\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/customer-portal/ping'\n          headers:\n            - name: Accept\n              value: application/json\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: false\n        docs: Health-check permanen. Tanpa client secret & tanpa token \u2014 dipakai verifikasi server hidup + CORS + JSON error.\n        examples:\n          - name: Server hidup.\n            request:\n              url: '{{baseUrl}}/api/customer-portal/ping'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n            response:\n              status: 200\n              statusText: OK\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"data\": {\n                      \"status\": \"ok\"\n                    }\n                  }\n      - info:\n          name: Resolusi QR\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{baseUrl}}/api/customer-portal/qr/resolve?code={{qr_code}}'\n          headers:\n            - name: Accept\n              value: application/json\n            - name: X-Portal-Client\n              value: '{{portalClientSecret}}'\n              description: Client secret portal (lapis pertama, WAJIB semua endpoint kecuali /ping).\n          params:\n            - name: code\n              value: '{{qr_code}}'\n              type: query\n              description: Kode `{token}.{signature}` dari URL QR `/q1/{code}`.\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n          forwardAuthorizationHeader: false\n        docs: |-\n          Dipanggil Portal begitu pelanggan scan QR \u2014 SEBELUM pelanggan punya token. Cukup `X-Portal-Client`, tanpa Bearer.\n\n          Balikin `login_id` + status akun (prefill halaman klaim/login) + `billing`: ringkasan tagihan belum lunas **TERSAMAR** (sejak 2026-11-14) \u2014 nama disamarkan, maks 12 tagihan `belum_dibayar`/`sebagian`, TANPA alamat/HP/nomor invoice/riwayat bayar. **TIDAK PERNAH** minta/balikin PIN.\n\n          `account_status`: `pending_claim` (arahkan ke form klaim), `active` (arahkan ke login), `null` (akun belum dibuat).\n\n          Limiter: `qr-public`.\n        examples:\n          - name: QR valid.\n            request:\n              url: '{{baseUrl}}/api/customer-portal/qr/resolve?code={{qr_code}}'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n                - name: X-Portal-Client\n                  value: '{{portalClientSecret}}'\n                  description: Client secret portal (lapis pertama, WAJIB semua endpoint kecuali /ping).\n              params:\n                - name: code\n                  value: '{{qr_code}}'\n                  type: query\n                  description: Kode `{token}.{signature}` dari URL QR `/q1/{code}`.\n            response:\n              status: 200\n              statusText: OK\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"login_id\": \"PNG00RQ000631\",\n                    \"account_status\": \"pending_claim\",\n                    \"billing\": {\n                      \"customer_name\": \"Bu** Sa*****\",\n                      \"display_id\": \"C1X4ARQ000631\",\n                      \"outstanding_total\": \"150000.00\",\n                      \"invoices\": [\n                        {\n                          \"billing_period\": \"2026-11\",\n                          \"due_date\": \"2026-11-15\",\n                          \"remaining_amount\": \"150000.00\",\n                          \"invoice_status\": {\n                            \"value\": \"belum_dibayar\",\n                            \"label\": \"Belum Dibayar\"\n                          }\n                        }\n                      ]\n                    }\n                  }\n          - name: Kode QR tidak valid/kedaluwarsa/dicabut/pop mismatch \u2014 4 kegagalan sengaja dijawab sama (anti-enumeration).\n            request:\n              url: '{{baseUrl}}/api/customer-portal/qr/resolve?code={{qr_code}}'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n                - name: X-Portal-Client\n                  value: '{{portalClientSecret}}'\n                  description: Client secret portal (lapis pertama, WAJIB semua endpoint kecuali /ping).\n              params:\n                - name: code\n                  value: '{{qr_code}}'\n                  type: query\n                  description: Kode `{token}.{signature}` dari URL QR `/q1/{code}`.\n            response:\n              status: 404\n              statusText: Not Found\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"message\": \"Kode QR tidak valid.\"\n                  }\n          - name: Client secret (X-Portal-Client) salah atau tidak ada.\n            request:\n              url: '{{baseUrl}}/api/customer-portal/qr/resolve?code={{qr_code}}'\n              method: GET\n              headers:\n                - name: Accept\n                  value: application/json\n                - name: X-Portal-Client\n                  value: '{{portalClientSecret}}'\n                  description: Client secret portal (lapis pertama, WAJIB semua endpoint kecuali /ping).\n              params:\n                - name: code\n                  value: '{{qr_code}}'\n                  type: query\n                  description: Kode `{token}.{signature}` dari URL QR `/q1/{code}`.\n            response:\n              status: 401\n              statusText: Unauthorized\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"message\": \"Client portal tidak dikenali.\"\n                  }\ndocs:\n  content: |-\n    # Whusnet Operational API Documentation\n\n    Selamat datang di **Dokumentasi Resmi Whusnet Operational API**.\n\n    Dokumen ini merupakan panduan teknis standar (_Official Technical Reference_) yang diterbitkan untuk mengatur integrasi antarsistem (_inbound API integration_) antara platform mitra/aplikasi eksternal dengan ekosistem infrastruktur **Whusnet**.\n\n    ---\n\n    ### **Ringkasan Sistem (System Overview)**\n\n    Whusnet Operational API bertindak sebagai _gateway_ komunikasi data _inbound_ untuk memfasilitasi pertukaran data operasional secara _real-time_, transparan, dan terstruktur. API ini dirancang khusus untuk menangani alur kerja integrasi _PoP (Point of Presence)_, pemetaan topologi, hingga konfirmasi alokasi jaringan secara otomatis.\n\n    ---\n\n    ### **Modul Utama API**\n\n    1. **PoP & Distribution Management** (`/api/v1`, Bearer token baca/tulis terpisah)\n        \n\n    - **Get Mini PoP Topology:** Menyediakan visibilitas _real-time_ terhadap hierarki, status perangkat, dan skema topologi Mini PoP yang terhubung.\n        \n    - **Confirm Network Assignment:** Memproses konfirmasi penugasan jaringan, sinkronisasi _port_, serta validasi alokasi _bandwidth/VLAN_ secara otomatis dari sistem eksternal ke infrastruktur Whusnet.\n        \n\n    2. **Portal Pelanggan** (`/api/customer-portal`)\n        \n\n    - Auth pelanggan (login, klaim PIN, refresh, logout), resolusi QR, profil, tagihan, pembayaran & kwitansi (JSON/PDF/HTML), saldo, ticketing, Web Push.\n        \n    - Endpoint staf via QR: buat tiket, worklist & pembayaran kolektor/teknisi.\n        \n\n    ---\n\n    ### **Standar Integrasi & Keamanan**\n\n    - **Base URL:** `{{baseUrl}}` = origin aplikasi (mis. `http://localhost`), path lengkap ada di tiap request: `/api/v1/*` dan `/api/customer-portal/*`.\n        \n    - **Format Data:** Semua _request_ dan _response_ menggunakan format **JSON** standar (`application/json`).\n        \n    - **Autentikasi:** `/api/v1` \u2014 Bearer token statis (`{{pop_distribusi_read_token}}` untuk baca, `{{network_assignment_write_token}}` untuk tulis). `/api/customer-portal` \u2014 header `X-Portal-Client` + Bearer access token pelanggan atau staff token (lihat deskripsi folder).\n        \n    - **HTTP Status Code Standard:**\n        \n    - `200 OK` \u2014 Permintaan berhasil diproses.\n        \n    - `400 Bad Request` \u2014 Format _payload_ atau parameter input tidak valid.\n        \n    - `401 Unauthorized` \u2014 Kredensial atau token API tidak valid / kedaluwarsa.\n        \n    - `500 Internal Server Error` \u2014 Terjadi kesalahan internal pada server Whusnet.\n        \n\n    ---\n\n    > **Catatan Penting:**  \n    Untuk arsitektur sistem tingkat lanjut, batasan tingkat layanan (_rate limiting_), serta rancangan alur _web-hook_ lengkap, silakan merujuk pada **Dokumen Rancangan Arsitektur Jaringan Whusnet** resmi.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-11-17T02:14:16.110Z'\n    exportedUsing: Bruno/4.3.0\n";
