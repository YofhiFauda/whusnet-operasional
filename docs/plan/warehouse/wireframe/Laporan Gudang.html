    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* ---- widget wrapper ---- */
    .w{
      position:fixed;
      pointer-events:none;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      color:#e2e8f0;
      transition:opacity .25s,transform .25s;
      z-index:2;
      transform:translateY(-50%);
    }
    .w.hide{opacity:0;pointer-events:none;transform:translateY(-50%) scale(.88)}
    .w.r{right:0}
    .w.l{left:0}

    /* ---- Pill body — lavender glass, always visible ---- */
    .w-body{
      width:64px;
      border-radius:30px;
      background:linear-gradient(160deg,#f4f3fc 0%,#edebf8 30%,#e6e3f5 50%,#eae8f7 70%,#f1f0fb 100%);
      border:1.5px solid rgba(124,58,237,.18);
      box-shadow:0 4px 18px rgba(124,58,237,.10),0 0 0 1px rgba(124,58,237,.10),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(124,58,237,.06);
      padding:8px 4px;
      display:flex;flex-direction:column;align-items:center;gap:6px;
      transition:all .5s cubic-bezier(.4,0,.2,1);
      user-select:none;overflow:hidden;position:relative;
      pointer-events:auto;cursor:grab;
    }
    .w-body:active{cursor:grabbing}
    .w-body.dragging,.w-body.dragging .wb{cursor:grabbing!important}

    /* Hover: deeper violet glass with glow */
    .w.hov .w-body{
      background:linear-gradient(160deg,#eeedf9 0%,#e4e0f5 25%,#ddd8f2 50%,#e2def4 75%,#eae8f8 100%);
      border-color:rgba(124,58,237,.30);
      box-shadow:0 8px 32px rgba(124,58,237,.20),0 0 0 1px rgba(124,58,237,.18),0 0 0 4px rgba(124,58,237,.07),0 0 20px rgba(124,58,237,.10),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(124,58,237,.08);
      transform:scale(1.03);
    }

    /* ---- Close button ---- */
    .w-close{
      position:absolute;top:-6px;
      width:18px;height:18px;border-radius:50%;
      background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.15);
      color:rgba(124,58,237,.35);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transition:all .25s;z-index:5;
      pointer-events:none;
    }
    .w.r .w-close{right:2px}
    .w.l .w-close{left:2px}
    .w.hov .w-close{opacity:1;pointer-events:auto}
    .w-close:hover{background:rgba(124,58,237,.55);color:#fff;transform:scale(1.12);border-color:rgba(124,58,237,.4)}

    /* ---- Drag grip dots (top & bottom caps) ---- */
    .w-grip{
      display:flex;align-items:center;justify-content:center;
      gap:3px;padding:2px 0;cursor:grab;flex-shrink:0;
      transition:all .4s cubic-bezier(.4,0,.2,1);
    }
    .w-grip-col{display:flex;flex-direction:column;gap:2.5px}
    .w-grip-dot{
      width:2px;height:2px;border-radius:50%;
      background:rgba(124,58,237,.22);
    }
    .w.hov .w-grip-dot{background:rgba(124,58,237,.35)}
    .w-body:active .w-grip-dot,.w-body.dragging .w-grip-dot{background:rgba(124,58,237,.50)}

    /* ---- Shared button base ---- */
    .wb{
      border-radius:50%;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;position:relative;
      pointer-events:auto!important;
    }
    /* active handled per-button for inset effect */

    /* ---- Delete button ---- */
    .wd{
      width:32px;height:32px;
      background:radial-gradient(circle at 40% 36%,#fda4af 0%,#fb7185 25%,#e11d48 60%,#be123c 100%);
      border:2px solid rgba(225,29,72,.35);color:#fff;
      box-shadow:inset 1px 1px 3px rgba(255,255,255,.4),0 2px 8px rgba(225,29,72,.10);
      transition:all .4s cubic-bezier(.4,0,.2,1);
    }
    .wd:hover:not(.off):not(.gone){
      transform:scale(1.08);
      background:radial-gradient(circle at 40% 36%,#fecdd3 0%,#fb7185 20%,#e11d48 55%,#be123c 100%);
      box-shadow:inset 1px 1px 4px rgba(255,255,255,.5),0 0 0 4px rgba(225,29,72,.12),0 0 18px rgba(225,29,72,.22),0 4px 14px rgba(225,29,72,.15);
    }
    .wd:active:not(.off):not(.gone){transform:scale(.92);box-shadow:inset 0 2px 6px rgba(0,0,0,.25),0 0 0 3px rgba(225,29,72,.10);transition:all .08s}
    .wd.off{opacity:.22;cursor:default}
    .wd.gone{
      background:transparent;border:2px solid rgba(225,29,72,.55);
      box-shadow:inset 0 1px 3px rgba(225,29,72,.10);
      color:rgba(225,29,72,.70);cursor:pointer;
    }

    /* ---- Hero button ---- */
    .wh{
      width:56px;height:56px;color:#fff;
      position:relative;overflow:hidden;
      transition:background .45s cubic-bezier(.4,0,.2,1),border .45s cubic-bezier(.4,0,.2,1),box-shadow .45s cubic-bezier(.4,0,.2,1),transform .2s ease;
      background:radial-gradient(circle at 40% 36%,#67e8f9 0%,#22d3ee 20%,#06b6d4 50%,#0891b2 100%);
      border:2px solid rgba(6,182,212,.40);
      box-shadow:inset 1px 1px 4px rgba(255,255,255,.5),0 2px 10px rgba(6,182,212,.12);
    }
    .wh:hover:not(.off):not(.stop){
      transform:scale(1.06);
      background:radial-gradient(circle at 40% 36%,#a5f3fc 0%,#22d3ee 18%,#06b6d4 48%,#0891b2 100%);
      box-shadow:inset 1px 1px 5px rgba(255,255,255,.6),0 0 0 4px rgba(6,182,212,.12),0 0 18px rgba(6,182,212,.22),0 4px 16px rgba(6,182,212,.15);
    }
    .wh:active:not(.off):not(.stop){transform:scale(.94);box-shadow:inset 0 2px 8px rgba(0,0,0,.2),0 0 0 3px rgba(6,182,212,.10);transition:all .08s}
    .wh.off{
      background:transparent;border:2px solid rgba(6,182,212,.55);
      box-shadow:inset 0 1px 3px rgba(6,182,212,.12);
      color:rgba(6,182,212,.75);cursor:default;
    }
    .wh.stop{
      background:radial-gradient(circle at 40% 38%,#f87171 0%,#ef4444 25%,#dc2626 55%,#b91c1c 100%);
      border:1.5px solid rgba(248,113,113,.30);
      box-shadow:inset 1px 1px 4px rgba(255,255,255,.5),0 0 0 3px rgba(239,68,68,.12),0 0 20px rgba(239,68,68,.25),0 0 40px rgba(220,38,38,.15),0 6px 20px rgba(185,28,28,.20);
      animation:heroMorph .5s cubic-bezier(.4,0,.2,1);
    }
    .wh.stop:hover{
      box-shadow:inset 1px 1px 5px rgba(255,255,255,.6),0 0 0 4px rgba(239,68,68,.18),0 0 28px rgba(239,68,68,.35),0 0 50px rgba(220,38,38,.20),0 8px 28px rgba(185,28,28,.25);
      transform:scale(1.04);
    }
    /* Running + hover: same red glow */
    .w.running .w-body:hover .wh.stop{
      box-shadow:inset 1px 1px 5px rgba(255,255,255,.6),0 0 0 4px rgba(239,68,68,.18),0 0 28px rgba(239,68,68,.35),0 0 50px rgba(220,38,38,.20),0 8px 28px rgba(185,28,28,.25);
    }
    /* Amber pause class — temporary marker drag preview */
    .wh.pause{
      background:radial-gradient(circle at 40% 38%,#fcd34d 0%,#fbbf24 25%,#f59e0b 55%,#d97706 100%);
      border:1.5px solid rgba(251,191,36,.30);
      box-shadow:inset 1px 1px 4px rgba(255,255,255,.5),0 0 0 3px rgba(245,158,11,.12),0 0 20px rgba(245,158,11,.25),0 0 40px rgba(217,119,6,.15),0 6px 20px rgba(217,119,6,.20);
    }
    /* Pause: show stats, hide icon — same as .stop */
    .wh.pause .wh-ico{opacity:0;transform:scale(.7)}
    .wh.pause .wh-rnd{opacity:1;transform:scale(1)}
    .wh.pause .wh-clk{opacity:1;transform:translateY(-50%) scale(1)}
    .wh.pause .wh-tm{opacity:1;transform:scale(1)}
    .wh.revealing{animation:heroReveal .5s cubic-bezier(.4,0,.2,1)}

    /* Hero content layers */
    .wh-ico{
      display:flex;align-items:center;justify-content:center;
      transition:opacity .25s,transform .25s;
      position:absolute;top:0;left:0;right:0;bottom:0;
    }
    .wh-rnd,.wh-clk,.wh-tm{
      position:absolute;left:0;right:0;
      font-family:'SF Mono',Monaco,'Cascadia Code',monospace;
      color:#fff;text-align:center;
      opacity:0;transition:opacity .25s,transform .25s;
      transform:scale(.85);pointer-events:none;
    }
    .wh-rnd{top:7px;font-size:8.5px;font-weight:600;color:rgba(255,255,255,.6)}
    .wh-clk{top:50%;transform:translateY(-50%) scale(.85);font-size:16px;font-weight:900;letter-spacing:-.3px}
    .wh-tm{bottom:6px;font-size:8.5px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.2px}

    /* Running: show info, hide icon */
    .wh.stop .wh-ico{opacity:0;transform:scale(.7)}
    .wh.stop .wh-rnd{opacity:1;transform:scale(1)}

    /* ---- Stats capsule ---- */
    .w-stats{

    /* ---- Interval control ---- */
    .wi{

    /* ---- Add button ---- */
    .wa{

    .wa:hover:not(.off):not(.sel){
      transform:scale(1.08);
      box-shadow:inset 1px 1px 4px rgba(255,255,255,.45),0 0 0 3px rgba(124,58,237,.15),0 3px 12px rgba(124,58,237,.20);

    .wa.sel svg{opacity:0;transition:opacity .15s}
    .wa.sel::after{
      content:'';position:absolute;width:14px;height:14px;

        linear-gradient(#fff,#fff) center top/2px 4px no-repeat,
        linear-gradient(#fff,#fff) center bottom/2px 4px no-repeat,
        linear-gradient(#fff,#fff) left center/4px 2px no-repeat,
        linear-gradient(#fff,#fff) right center/4px 2px no-repeat;

    .wa.off{opacity:.25;cursor:default}

    .wa.sel{

    /* ============================================= */
    /* ===== COLLAPSE/EXPAND ANIMATION ============= */
    /* ============================================= */
    .w.running .w-body{
      width:64px;height:64px;border-radius:50%;
