            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);

            // Lucide Icon trigger after render

                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Filtered tickets
            const filteredTickets = useMemo(() => {
                return tickets.filter(t => {
                    // Tab filter
                    if (activeTab === 'Ticket' && t.tab !== 'Ticket') return false;
                    if (activeTab === 'Assign NOC' && t.tab !== 'Assign NOC') return false;
                    if (activeTab === 'Assign FOP' && t.tab !== 'Assign FOP') return false;
                    if (activeTab === 'Selesai' && t.tab !== 'Selesai') return false;

                    // Priority filter
                    if (filterPriority !== 'ALL' && t.priority !== filterPriority) return false;

                    // Search filter
                    if (searchTerm.trim() !== '') {
                        const q = searchTerm.toLowerCase();
                        const matchId = t.id.toLowerCase().includes(q);
                        const matchName = t.customer.name.toLowerCase().includes(q);
                        const matchCid = t.customer.cid.toLowerCase().includes(q);
                        const matchPhone = t.customer.phone.includes(q);
                        const matchIssue = t.issue.category.toLowerCase().includes(q) || t.issue.complaint.toLowerCase().includes(q);
                        return matchId || matchName || matchCid || matchPhone || matchIssue;
                    }

                    return true;
                });
            }, [tickets, activeTab, filterPriority, searchTerm]);

                return {
                    total: tickets.length,
                    masuk: tickets.filter(t => t.tab === 'Ticket').length,
                    noc: tickets.filter(t => t.tab === 'Assign NOC').length,
                    fop: tickets.filter(t => t.tab === 'Assign FOP').length,
                    selesai: tickets.filter(t => t.tab === 'Selesai').length,
                }
            }, [tickets]);

                setTickets(prev => prev.map(t => {
                    if (t.id === ticketId) {
                        return {
                            ...t,
                            tab: targetTab,
                            status: newStatus
                        };
                    }
                    return t;
                }));
                showToast(`Status Tiket ${ticketId} berhasil dipindahkan ke: ${newStatus}`);
            };

                if (issueCategory === 'LOS') badgeClr = 'bg-red-500 text-white';
                else if (issueCategory === 'Lemot') badgeClr = 'bg-amber-500 text-white';
                else if (issueCategory === 'Kabel Putus') badgeClr = 'bg-purple-600 text-white';

                    id: newId,
                    priority: priority,
                    status: 'Ticket Masuk',
                    tab: 'Ticket',
                    timeAgo: 'Just now',
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),

                    issue: {
                        category: issueCategory,
                        badgeColor: badgeClr,
                        complaint: complaintText || 'Tidak ada detail keluhan.',
                    }
                };

                showToast(`Tiket Baru ${newId} berhasil dibuat!`);
                // Reset complaint

                                                            <div className="flex items-start justify-between">
                                                                <div className="flex items-center space-x-2">
                                                                    <span className="font-mono font-extrabold text-brand-600 dark:text-brand-400 text-xs">{t.id}</span>
                                                                    <span className={`px-1.5 py-0.2 rounded text-[9px] font-extrabold ${
                                                                        t.priority === 'URGENT' ? 'bg-rose-500 text-white' :
                                                                        t.priority === 'HIGH' ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300'
                                                                    }`}>
                                                                        {t.priority}
                                                                    </span>
                                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${t.issue.badgeColor}`}>
                                                                        {t.issue.category}
                                                                    </span>
                                                                </div>
                                                                <span className="text-[10px] text-slate-400 font-medium flex items-center space-x-1">
                                                                    <i data-lucide="clock" className="w-3 h-3"></i>
                                                                    <span>{t.timeAgo}</span>
                                                                </span>
                                                            </div>

                                                            {/* Customer Details */}
                                                            <div className="bg-slate-50 dark:bg-slate-700/40 rounded-lg p-2 text-xs space-y-1">
                                                                <div className="flex items-center justify-between">
                                                                    <div className="font-bold text-slate-900 dark:text-white truncate">{t.customer.name}</div>
                                                                    <span className="text-[10px] font-mono text-slate-500 font-bold bg-white dark:bg-slate-800 px-1 rounded border border-slate-200 dark:border-slate-600">
                                                                        {t.customer.cid}
                                                                    </span>
                                                                </div>
                                                                <div className="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
                                                                    <span className="truncate">{t.customer.phone}</span>
                                                                    <span className="font-medium text-slate-700 dark:text-slate-300">{t.customer.pop} • {t.customer.odp}</span>
                                                                </div>
                                                            </div>

                                                            {/* Complaint Excerpt */}
                                                            <p className="text-xs text-slate-600 dark:text-slate-300 leading-snug line-clamp-2 px-1">
                                                                "{t.issue.complaint}"
                                                            </p>

                                                            {/* Quick Actions Bar */}
                                                            <div className="pt-2 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between gap-1.5 w-full">
                                                                <button 
                                                                    onClick={() => handleMoveStatus(t.id, 'Selesai', 'Selesai')}
                                                                    className="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[10px] font-bold transition-all shadow-sm flex items-center justify-center space-x-1 shrink-0"
                                                                >
                                                                    <i data-lucide="check" className="w-3 h-3"></i>
                                                                    <span>SELESAI</span>
                                                                </button>
                                                                <button 
                                                                    onClick={() => handleMoveStatus(t.id, 'Assign NOC', 'Escalated NOC')}
                                                                    className="flex-1 py-1.5 bg-noc-600 hover:bg-noc-700 text-white rounded-lg text-[10px] font-bold transition-all shadow-sm flex items-center justify-center space-x-1 shrink-0"
                                                                >
                                                                    <i data-lucide="arrow-right" className="w-3 h-3"></i>
                                                                    <span>KE NOC</span>
                                                                </button>
                                                                <button 
                                                                    onClick={() => handleMoveStatus(t.id, 'Assign FOP', 'Escalated Field FOP')}
                                                                    className="flex-1 py-1.5 bg-fop-600 hover:bg-fop-700 text-white rounded-lg text-[10px] font-bold transition-all shadow-sm flex items-center justify-center space-x-1 shrink-0"
                                                                >
                                                                    <i data-lucide="truck" className="w-3 h-3"></i>
                                                                    <span>KE FOP</span>
                                                                </button>
                                                            </div>

                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </>
                                    )}

                                </div>

                                {/* FOOTER STATS BAR */}
                                <footer className="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-4 py-2 flex items-center justify-between text-[11px] text-slate-500">
                                    <div className="flex items-center space-x-4">
                                        <span>Menampilkan <strong className="text-slate-800 dark:text-white">{filteredTickets.length}</strong> dari {tickets.length} Tiket</span>
                                        <span className="hidden md:inline">• SLA Compliance: <strong className="text-emerald-600">96.8%</strong></span>
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        <span className="flex items-center space-x-1">
                                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                            <span className="font-semibold text-slate-700 dark:text-slate-300">Live Sync Active</span>
                                        </span>
                                    </div>
                                </footer>

                            </div>

                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
